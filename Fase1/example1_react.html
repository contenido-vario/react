<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- No usar en producción: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <title>Hola Mundo</title>
  </head>
  <body>
    <div id="cuerpo"></div>



    <script type="text/babel">
    
      function MyApp() {
        // componente de React
        return <h1>¡Hola Mundo desde React!</h1>;
      }

      const container = document.getElementById('cuerpo');
      const cuerpo = ReactDOM.createRoot(container);

      // Renderizar componente de React
      cuerpo.render(<MyApp />);

    </script>
    <!--
      IMPORTANTE:
      Esta página es una gran forma de aprender React pero no es recomendable para producción.
      Compila lentamente JSX con Babel en el navegador y utiliza gran cantidad de recursos para React.
    -->
  </body>
</html>
