<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>Paso 1: Frontend Estático</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

  <div id="cuerpo" class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl"></div>

  <script type="text/babel">
    
    // Todo está metido en una sola estructura JSX "harcodeada" (datos estáticos)
    function App() {
      return (
        <div>
          <h1 className="text-2xl font-bold mb-6 text-center text-indigo-400">
            Paso 1: Interfaz Estática
          </h1>

          {/* Formulario estático */}
          <form className="flex gap-2 mb-4">
            <input
              type="text"
              placeholder="¿Qué necesitas hacer?"
              className="flex-1 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none"
            />
            <button type="submit" className="px-4 py-2 bg-indigo-600 font-medium rounded-lg">
              Añadir
            </button>
          </form>

          {/* Lista estática escrita directamente en HTML */}
          <ul className="space-y-2">
            <li className="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-700">
              <span>Aprender la sintaxis básica de JSX</span>
              <button className="text-red-400 px-2">✕</button>
            </li>

            <li className="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-700">
              <span className="line-through text-slate-400">Instalar la extensión de React</span>
              <button className="text-red-400 px-2">✕</button>
            </li>
          </ul>
        </div>
      );
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<App />);

  </script>
</body>
</html>
