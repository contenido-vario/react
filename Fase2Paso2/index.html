<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>Paso 2: Componentes Reutilizables</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

  <div id="cuerpo" class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl"></div>

  <script type="text/babel">

    // Componente 1: Encargado únicamente de la cabecera
    function Header() {
      return (
        <h1 className="text-2xl font-bold mb-6 text-center text-indigo-400">
          Paso 2: Componentes Divididos
        </h1>
      );
    }

    // Componente 2: Encargado de la entrada de datos
    function TodoForm() {
      return (
        <form className="flex gap-2 mb-4">
          <input
            type="text"
            placeholder="¿Qué necesitas hacer?"
            className="flex-1 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none"
          />
          <button type="submit" className="px-4 py-2 bg-indigo-600 font-medium rounded-lg">
            Añadir
          </button>
        </form>
      );
    }

    // Componente 3: Encargado de mostrar un solo ítem de la lista
    function TodoItem() {
      return (
        <li className="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-700">
          <span>Aprender la sintaxis de componentes</span>
          <button className="text-red-400 px-2">✕</button>
        </li>
      );
    }

    // Componente 4: Encargado del contenedor de la lista
    function TodoList() {
      return (
        <ul className="space-y-2">
          {/* Reutilizamos el componente TodoItem varias veces */}
          <TodoItem />
          <TodoItem />
          <TodoItem />
        </ul>
      );
    }

    // Componente Principal (Ensamblador)
    function App() {
      return (
        <div>
          <Header />
          <TodoForm />
          <TodoList />
        </div>
      );
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<App />);

  </script>
</body>
</html>
