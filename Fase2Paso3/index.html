<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>Paso 3: Pasar Props</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

  <div id="cuerpo" class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl"></div>

  <script type="text/babel">

    // El componente recibe 'props' como primer parámetro (usamos desestructuración)
    function Header({ titulo }) {
      return (
        <h1 className="text-2xl font-bold mb-6 text-center text-indigo-400">
          {titulo}
        </h1>
      );
    }

    function TodoForm({ textoBoton }) {
      return (
        <form className="flex gap-2 mb-4">
          <input
            type="text"
            placeholder="¿Qué necesitas hacer?"
            className="flex-1 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none"
          />
          <button type="submit" className="px-4 py-2 bg-indigo-600 font-medium rounded-lg">
            {textoBoton}
          </button>
        </form>
      );
    }

    // Recibe un objeto 'tarea' como prop
    function TodoItem({ tarea }) {
      return (
        <li className="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-700">
          <span className={tarea.completado ? "line-through text-slate-400" : ""}>
            {tarea.texto}
          </span>
          <button className="text-red-400 px-2">✕</button>
        </li>
      );
    }

    // Recibe el array completo de 'tareas' y las recorre usando .map()
    function TodoList({ tareas }) {
      return (
        <ul className="space-y-2">
          {tareas.map((tarea) => (
            /* Es obligatorio pasar una 'key' única cuando renderizamos listas en React */
            <TodoItem key={tarea.id} tarea={tarea} />
          ))}
        </ul>
      );
    }

    // Componente Principal: Contiene los datos que distribuirá a los hijos
    function App() {
      // Array de datos simulados
      const misTareas = [
        { id: 1, texto: 'Entender qué son las Props', completado: true },
        { id: 2, texto: 'Recorrer arrays con .map() en JSX', completado: false },
        { id: 3, texto: 'Usar la prop obligatoria "key"', completado: false }
      ];

      return (
        <div>
          <Header titulo="Paso 3: Props Dinámicas" />
          <TodoForm textoBoton="Guardar" />
          <TodoList tareas={misTareas} />
        </div>
      );
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<App />);

  </script>
</body>
</html>
