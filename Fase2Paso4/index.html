<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <title>Paso 4: Eventos</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

  <div id="cuerpo" class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl"></div>

  <script type="text/babel">

    function Header({ titulo }) {
      return (
        <h1 className="text-2xl font-bold mb-6 text-center text-indigo-400">
          {titulo}
        </h1>
      );
    }

    function TodoForm() {
      // Manejador del evento de envío del formulario
      const handleSubmit = (e) => {
        e.preventDefault(); // Previene que la página se recargue
        alert("¡Intentaste enviar el formulario!");
      };

      // Manejador del evento de escritura en el input
      const handleChange = (e) => {
        console.log("Texto tipeado:", e.target.value);
      };

      return (
        <form onSubmit={handleSubmit} className="flex gap-2 mb-4">
          <input
            type="text"
            onChange={handleChange}
            placeholder="Escribe algo y mira la consola..."
            className="flex-1 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none"
          />
          <button type="submit" className="px-4 py-2 bg-indigo-600 font-medium rounded-lg">
            Añadir
          </button>
        </form>
      );
    }

    function TodoItem({ tarea }) {
      // Manejador para cuando se hace clic en la tarea
      const handleClickTarea = () => {
        console.log(`Hiciste clic en la tarea: ${tarea.texto}`);
      };

      // Manejador para eliminar
      const handleEliminar = (e) => {
        e.stopPropagation(); // Evita que se active el clic del contenedor padre
        alert(`Eliminar la tarea con ID: ${tarea.id}`);
      };

      return (
        <li 
          onClick={handleClickTarea}
          className="flex items-center justify-between p-3 bg-slate-700/50 rounded-lg border border-slate-700 cursor-pointer hover:bg-slate-700 transition"
        >
          <span className={tarea.completado ? "line-through text-slate-400" : ""}>
            {tarea.texto}
          </span>
          <button 
            onClick={handleEliminar} 
            className="text-red-400 hover:text-red-300 px-2 font-bold"
          >
            ✕
          </button>
        </li>
      );
    }

    function TodoList({ tareas }) {
      return (
        <ul className="space-y-2">
          {tareas.map((tarea) => (
            <TodoItem key={tarea.id} tarea={tarea} />
          ))}
        </ul>
      );
    }

    function App() {
      const misTareas = [
        { id: 1, texto: 'Capturar el submit del formulario', completado: true },
        { id: 2, texto: 'Capturar el onChange del input', completado: false },
        { id: 3, texto: 'Capturar el onClick de los botones', completado: false }
      ];

      return (
        <div>
          <Header titulo="Paso 4: Captura de Eventos" />
          <TodoForm />
          <TodoList tareas={misTareas} />
        </div>
      );
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<App />);

  </script>
</body>
</html>
